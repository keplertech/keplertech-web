# Static site: no build step. Netlify serves the "site" folder as-is.
[build]
  publish = "site"
  # Set explicitly so a build command left in the Netlify UI is not used.
  command = "echo 'No build step'"

# Old Hugo pages now live as sections of the single page.
[[redirects]]
  from = "/blog/*"
  to = "/#talks"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/linkedin/*"
  to = "/#team"
  status = 301

# Security headers. Scripts and styles are inline in index.html, hence
# 'unsafe-inline'; everything else (fonts, media, icons, count.js) is served
# from this site. The only outside request is the visit count sent to GoatCounter.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://keplertech.goatcounter.com; media-src 'self'; connect-src https://keplertech.goatcounter.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Browser caching. Netlify's default makes browsers re-check every file on
# every visit. The pages keep that default so edits show at once. Fonts never
# change: cached for a year. Media, icons and count.js may be replaced under the
# same name: cached for a week (rename a file to make visitors fetch it at once).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/count.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
