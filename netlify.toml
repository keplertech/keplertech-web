# Static site: no build step. Netlify serves the "site" folder as-is.
[build]
  publish = "site"
  # Set explicitly so a build command left in the Netlify UI is not used.
  command = "echo 'No build step'"

# Old Hugo pages now live as sections of the single page.
[[redirects]]
  from = "/blog/*"
  to = "/#talks"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/linkedin/*"
  to = "/#team"
  status = 301

# Security headers. Scripts and styles are inline in index.html, hence
# 'unsafe-inline'; everything else (fonts, media, count.js) is served from this
# site. The only outside request is the visit count sent to GoatCounter.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://keplertech.goatcounter.com; connect-src https://keplertech.goatcounter.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
