# Static site: no build step. Netlify serves the "site" folder as-is.
[build]
  publish = "site"

# Old Hugo pages now live as sections of the single page.
[[redirects]]
  from = "/blog/*"
  to = "/#talks"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/linkedin/*"
  to = "/#team"
  status = 301
